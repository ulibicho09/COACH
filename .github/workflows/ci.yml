name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      OWNER_EMAIL: test@example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: bash .github/ci-run.sh "Instalacion" npm install --no-audit --no-fund

      - name: Build
        run: bash .github/ci-run.sh "Build" npm run build

      - name: Tipos
        run: bash .github/ci-run.sh "Tipos" npm run typecheck

      - name: Pruebas
        run: bash .github/ci-run.sh "Pruebas" npm test
